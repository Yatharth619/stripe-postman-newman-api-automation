name: Stripe API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests
        run: |
          newman run "postman/Stripe API Automation.postman_collection.json" \
          -e "postman/Stripe Sandbox.postman_environment.json" \
          --env-var "secretKey=${{ secrets.STRIPE_SECRET_KEY }}" \
          -r cli,htmlextra \
          --reporter-htmlextra-export "reports/stripe-report.html"

      - name: Upload Newman report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: stripe-api-test-report
            path: reports/stripe-report.html